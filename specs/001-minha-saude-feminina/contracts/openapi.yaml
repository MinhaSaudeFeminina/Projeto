openapi: 3.0.3
info:
  title: Minha Saúde Feminina Admin API
  version: 1.0.0
  description: API administrativa para o incremento de portal web, backend Laravel e PostgreSQL.
servers:
  - url: /api/v1/admin
paths:
  /auth/login:
    post:
      summary: Autentica usuária administrativa
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão administrativa criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciais inválidas ou acesso inativo
  /auth/logout:
    post:
      summary: Encerra sessão administrativa
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout realizado
  /auth/me:
    get:
      summary: Retorna usuária administrativa autenticada
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuária autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'

  /dashboard:
    get:
      summary: Retorna indicadores do fluxo editorial
      tags: [Dashboard]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Totais de conteúdos por estado editorial
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [drafts, in_review, published, archived]
                    properties:
                      drafts: { type: integer, minimum: 0 }
                      in_review: { type: integer, minimum: 0 }
                      published: { type: integer, minimum: 0 }
                      archived: { type: integer, minimum: 0 }

  /admin-users:
    get:
      summary: Lista usuárias administrativas
      tags: [Admin Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuárias administrativas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
    post:
      summary: Cria usuária administrativa
      tags: [Admin Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserWrite'
      responses:
        '201':
          description: Usuária administrativa criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '403':
          description: Perfil sem permissão
  /admin-users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      summary: Atualiza usuária administrativa
      tags: [Admin Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserWrite'
      responses:
        '200':
          description: Usuária administrativa atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '403':
          description: Perfil sem permissão

  /app-users:
    get:
      summary: Lista usuárias cadastradas pelo app
      tags: [App Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuárias mobile para administração web
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppUser'
        '403':
          description: Perfil sem permissão
  /app-users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      summary: Atualiza perfil e status de usuária do app
      tags: [App Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserWrite'
      responses:
        '200':
          description: Usuária mobile atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '403':
          description: Perfil sem permissão

  /roles:
    get:
      summary: Lista perfis administrativos
      tags: [Roles]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfis administrativos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminRoleRecord'
  /permissions:
    get:
      summary: Lista permissões administrativas
      tags: [Roles]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Permissões administrativas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'

  /taxonomies:
    get:
      summary: Lista todas as taxonomias ativas para edição de conteúdo
      tags: [Taxonomies]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categorias, fases da vida e faixas etárias
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          $ref: '#/components/schemas/ContentCategory'
                      life_stages:
                        type: array
                        items:
                          $ref: '#/components/schemas/LifeStage'
                      age_ranges:
                        type: array
                        items:
                          $ref: '#/components/schemas/AgeRange'

  /categories:
    get:
      summary: Lista categorias de conteúdo
      tags: [Taxonomies]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentCategory'
    post:
      summary: Cria categoria de conteúdo
      tags: [Taxonomies]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentCategory'
  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      summary: Atualiza categoria de conteúdo
      tags: [Taxonomies]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentCategory'
    delete:
      summary: Remove categoria de conteúdo
      tags: [Taxonomies]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Categoria removida
        '403':
          description: Apenas administradoras podem remover categorias
        '422':
          description: Categoria vinculada a conteúdos existentes
  /life-stages:
    get:
      summary: Lista fases da vida
      tags: [Taxonomies]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Fases da vida
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LifeStage'
  /age-ranges:
    get:
      summary: Lista faixas etárias
      tags: [Taxonomies]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Faixas etárias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgeRange'

  /support-contacts:
    get:
      summary: Lista contatos de apoio
      tags: [Support Contacts]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contatos de apoio
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportContact'
    post:
      summary: Cria contato de apoio
      tags: [Support Contacts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportContactWrite'
      responses:
        '201':
          description: Contato de apoio criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SupportContact'
  /support-contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      summary: Atualiza contato de apoio
      tags: [Support Contacts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportContactWrite'
      responses:
        '200':
          description: Contato de apoio atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SupportContact'
    delete:
      summary: Exclui contato de apoio
      tags: [Support Contacts]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Contato de apoio excluído

  /reminders:
    get:
      summary: Lista lembretes e campanhas
      tags: [Reminders]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Busca por título, tolerante a acentos
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ReminderType'
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Lembretes e campanhas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reminder'
    post:
      summary: Cria lembrete ou campanha
      tags: [Reminders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderWrite'
      responses:
        '201':
          description: Lembrete criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reminder'
  /reminders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      summary: Atualiza lembrete ou campanha
      tags: [Reminders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderWrite'
      responses:
        '200':
          description: Lembrete atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reminder'
    delete:
      summary: Exclui lembrete ou campanha
      tags: [Reminders]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Lembrete excluído
  /reminders/{id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Duplica lembrete como cópia inativa
      tags: [Reminders]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Cópia criada, sempre inativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reminder'

  /contents:
    get:
      summary: Lista e busca conteúdos administrativos
      tags: [Contents]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Termo de busca tolerante a acentos
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EditorialStatus'
        - name: category_id
          in: query
          schema:
            type: integer
          description: Filtra pela categoria editorial
        - name: life_stage_id
          in: query
          schema:
            type: integer
          description: Filtra pela fase da vida associada
        - name: age_range_id
          in: query
          schema:
            type: integer
          description: Filtra pela faixa etária associada
        - name: author_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Lista de conteúdos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EducationalContent'
    post:
      summary: Cria conteúdo em Rascunho
      tags: [Contents]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentWrite'
      responses:
        '201':
          description: Conteúdo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationalContent'
  /contents/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Detalha conteúdo
      tags: [Contents]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conteúdo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationalContent'
    patch:
      summary: Atualiza conteúdo conforme permissões
      tags: [Contents]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentWrite'
      responses:
        '200':
          description: Conteúdo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationalContent'
        '403':
          description: Perfil sem permissão

  /contents/{id}/submit-review:
    post:
      summary: Envia Rascunho para revisão
      tags: [Editorial Workflow]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Conteúdo Em revisão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationalContent'
  /contents/{id}/request-adjustments:
    post:
      summary: Solicita ajustes e retorna conteúdo para Rascunho
      tags: [Editorial Workflow]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditorialComment'
      responses:
        '200':
          description: Ajustes solicitados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationalContent'
  /contents/{id}/approve:
    post:
      summary: Aprova conteúdo Em revisão
      tags: [Editorial Workflow]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditorialComment'
      responses:
        '200':
          description: Conteúdo aprovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationalContent'
  /contents/{id}/publish:
    post:
      summary: Publica conteúdo Aprovado
      tags: [Editorial Workflow]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Conteúdo publicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationalContent'
  /contents/{id}/archive:
    post:
      summary: Arquiva conteúdo Publicado
      tags: [Editorial Workflow]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Conteúdo arquivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationalContent'

  /contents/{id}/audit:
    get:
      summary: Lista auditoria editorial de um conteúdo
      tags: [Audit]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Eventos de auditoria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EditorialAuditEvent'
  /contents/{id}/revisions:
    get:
      summary: Lista histórico de alterações de um conteúdo
      tags: [Audit]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Histórico de alterações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentRevision'

  /anonymous-questions:
    get:
      summary: Lista e filtra perguntas anônimas recebidas
      tags: [Anonymous Questions]
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AnonymousQuestionStatus' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/AnonymousQuestionPriority' } }
      responses:
        '200':
          description: Lista paginada de perguntas anônimas
        '403':
          description: Perfil sem permissão
  /anonymous-questions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Exibe uma pergunta anônima
      tags: [Anonymous Questions]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pergunta anônima encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AnonymousQuestion'
        '403':
          description: Perfil sem permissão
  /anonymous-questions/{id}/answer:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Salva a resposta orientativa de uma pergunta anônima
      tags: [Anonymous Questions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, maxLength: 5000 }
                internal_notes: { type: string, nullable: true, maxLength: 5000 }
      responses:
        '200':
          description: Resposta salva
        '403':
          description: Perfil sem permissão
        '409':
          description: Pergunta já arquivada
        '422':
          description: Dados inválidos
  /anonymous-questions/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Arquiva uma pergunta anônima
      tags: [Anonymous Questions]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pergunta arquivada
        '403':
          description: Perfil sem permissão

  /notifications:
    get:
      summary: Lista notificações administrativas
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notificações da usuária autenticada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminNotification'
  /notifications/{id}/read:
    post:
      summary: Marca notificação como lida
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Notificação marcada como lida

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/AdminUser'
    AdminRole:
      type: string
      enum: [academic_author, reviewer_professor, admin]
    AdminRoleRecord:
      type: object
      required: [id, key, name]
      properties:
        id:
          type: integer
        key:
          $ref: '#/components/schemas/AdminRole'
        name:
          type: string
          example: "Acadêmica/autora"
        description:
          type: string
          nullable: true
    Permission:
      type: object
      required: [id, key, name]
      properties:
        id:
          type: integer
        key:
          type: string
          example: "content.publish"
        name:
          type: string
          example: "Publicar conteúdo"
        description:
          type: string
          nullable: true
    AdminUser:
      type: object
      required: [id, name, email, role, is_active]
      properties:
        id:
          type: integer
        name:
          type: string
          example: "Dra. Ana Luísa"
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/AdminRole'
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
    AdminUserWrite:
      type: object
      required: [name, email, role, is_active]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/AdminRole'
        is_active:
          type: boolean
        password:
          type: string
          format: password
          description: Obrigatório na criação; opcional na edição.
    AppUser:
      type: object
      required: [id, name, email, is_active, notifications_active]
      properties:
        id:
          type: integer
        name:
          type: string
          example: "Maria Saúde"
        email:
          type: string
          format: email
        age:
          type: integer
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        life_stage_id:
          type: integer
          nullable: true
        life_stage:
          type: string
          nullable: true
          example: "Fase adulta"
        is_active:
          type: boolean
        notifications_active:
          type: boolean
        last_access_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
    AppUserWrite:
      type: object
      required: [name, email, notifications_active, is_active]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        birth_date:
          type: string
          format: date
          nullable: true
        life_stage_id:
          type: integer
          nullable: true
        notifications_active:
          type: boolean
        is_active:
          type: boolean
    EditorialStatus:
      type: string
      enum: [draft, in_review, approved, published, archived]
    ContentWrite:
      type: object
      required: [title, body, category_id]
      properties:
        title:
          type: string
          example: "Saúde íntima e menstruação"
        summary:
          type: string
          example: "Orientações educativas sobre saúde íntima."
        body:
          type: string
        category_id:
          type: integer
        life_stage_ids:
          type: array
          items:
            type: integer
        age_range_ids:
          type: array
          items:
            type: integer
    EducationalContent:
      type: object
      required: [id, title, body, status, author_id, created_at, updated_at]
      properties:
        id:
          type: integer
        title:
